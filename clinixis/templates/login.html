<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clinixis — Sign In</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root {
    --primary:#1565c0;--primary-dark:#0d47a1;--primary-light:#e3f0fd;
    --teal:#00796b;--text:#1a1a2e;--text-muted:#718096;
    --border:#e8edf2;--bg:#f4f7fb;--white:#ffffff;
    --red:#c62828;--red-light:#ffebee;--radius:12px;--radius-sm:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);min-height:100vh;display:flex;flex-direction:column;}
  .auth-top{background:linear-gradient(135deg,var(--primary-dark) 0%,var(--primary) 60%,var(--teal) 100%);padding:52px 28px 40px;text-align:center;position:relative;overflow:hidden;}
  .auth-top::before{content:'';position:absolute;top:-40px;right:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,0.07);}
  .auth-top::after{content:'';position:absolute;bottom:-60px;left:-30px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,0.05);}
  .auth-icon{width:60px;height:60px;border-radius:18px;background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:26px;color:white;}
  .auth-logo{font-size:32px;font-weight:900;color:white;letter-spacing:-1px;margin-bottom:6px;}
  .auth-logo span{color:rgba(255,255,255,0.7);}
  .auth-tagline{color:rgba(255,255,255,0.75);font-size:14px;}
  .auth-body{flex:1;padding:28px 20px 40px;max-width:420px;margin:0 auto;width:100%;}
  .auth-title{font-size:22px;font-weight:800;margin-bottom:4px;color:var(--text);letter-spacing:-0.3px;}
  .auth-sub{color:var(--text-muted);font-size:14px;margin-bottom:24px;}
  .form-group{margin-bottom:14px;}
  .form-label{display:block;font-size:11px;font-weight:700;margin-bottom:6px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;}
  .form-control{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:15px;background:var(--white);color:var(--text);transition:all .15s;}
  .form-control:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(21,101,192,0.1);}
  .btn{display:block;width:100%;padding:13px;border-radius:var(--radius-sm);font-size:15px;font-weight:700;cursor:pointer;border:none;text-align:center;text-decoration:none;transition:all .15s;}
  .btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:white;box-shadow:0 4px 12px rgba(21,101,192,0.35);margin-bottom:14px;}
  .btn-primary:hover{box-shadow:0 6px 16px rgba(21,101,192,0.4);}
  .alert{padding:12px 14px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:16px;background:var(--red-light);color:var(--red);border:1px solid #ffcdd2;display:flex;gap:8px;align-items:center;}
  .auth-switch{text-align:center;color:var(--text-muted);font-size:14px;margin-top:12px;}
  .auth-switch a{color:var(--primary);font-weight:700;text-decoration:none;}
  .demo-box{background:var(--primary-light);border:1px solid #bbdefb;border-radius:var(--radius-sm);padding:13px 16px;margin-bottom:20px;font-size:13px;color:var(--primary-dark);}
  .demo-box strong{display:block;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:5px;opacity:0.8;}
  .demo-row{display:flex;align-items:center;gap:8px;margin-top:3px;}
  .demo-tag{background:rgba(21,101,192,0.12);padding:2px 8px;border-radius:4px;font-family:monospace;font-size:12px;}
</style>
</head>
<body>
<div class="auth-top">
  <div class="auth-icon"><i class="fa-solid fa-capsules"></i></div>
  <div class="auth-logo">Clini<span>xis</span></div>
  <div class="auth-tagline">Your stock. Your sales. Under control.</div>
</div>
<div class="auth-body">
  <h1 class="auth-title">Welcome back</h1>
  <p class="auth-sub">Sign in to your account</p>

  <div class="demo-box">
    <strong>Demo account</strong>
    <div class="demo-row"><span>Email:</span> <span class="demo-tag">demo@clinixis.ng</span></div>
    <div class="demo-row"><span>Password:</span> <span class="demo-tag">demo1234</span></div>
  </div>

  {% if error %}
  <div class="alert"><i class="fa-solid fa-circle-exclamation"></i> {{ error }}</div>
  {% endif %}

  <form method="POST">
    <div class="form-group">
      <label class="form-label">Email address</label>
      <input class="form-control" type="email" name="email" placeholder="your@email.com" required>
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input class="form-control" type="password" name="password" placeholder="Enter your password" required>
    </div>
    <button class="btn btn-primary" type="submit">Sign in</button>
  </form>
  <div class="auth-switch">No account? <a href="/register">Register your business</a></div>
</div>
</body>
</html>
