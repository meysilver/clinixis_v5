<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access Denied — Clinixis</title>
<style>
  :root { --blue: #1a6fb5; --blue-dark: #0f4f8a; --text: #1a1a2e; --text-muted: #6b7280; --bg: #f0f4f8; --white: #ffffff; --danger: #c0392b; --danger-light: #fdf0ef; --radius: 10px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { background: var(--white); border-radius: 16px; padding: 40px 32px; text-align: center; max-width: 360px; width: 100%; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
  .icon { font-size: 56px; margin-bottom: 16px; }
  .title { font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
  .sub { font-size: 14px; color: var(--text-muted); line-height: 1.6; margin-bottom: 24px; }
  .btn { display: block; padding: 12px; border-radius: var(--radius); font-size: 15px; font-weight: 600; text-decoration: none; background: var(--blue); color: white; text-align: center; }
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="card">
  <div class="icon"><i class="fa-solid fa-lock" style="color:#c0392b;"></i></div>
  <div class="title">Access Restricted</div>
  <div class="sub">This section is only available to the business owner. Contact your manager if you need access.</div>
  <a href="/dashboard" class="btn">Back to Dashboard</a>
</div>
</body>
</html>
