<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clinixis — Register</title>
<style>
  :root { --blue: #1a6fb5; --blue-dark: #0f4f8a; --blue-light: #e8f2fb; --text: #1a1a2e; --text-muted: #6b7280; --border: #e2e8f0; --bg: #f0f4f8; --white: #ffffff; --danger: #c0392b; --danger-light: #fdf0ef; --radius: 10px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); min-height: 100vh; display: flex; flex-direction: column; }
  .auth-header { background: var(--blue-dark); padding: 32px 24px 28px; text-align: center; }
  .auth-logo { font-size: 28px; font-weight: 800; color: white; letter-spacing: -1px; margin-bottom: 4px; }
  .auth-logo span { color: #64b5f6; }
  .auth-tagline { color: rgba(255,255,255,0.7); font-size: 13px; }
  .auth-body { flex: 1; padding: 24px 20px 40px; max-width: 420px; margin: 0 auto; width: 100%; }
  .auth-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; color: var(--text); }
  .auth-sub { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }
  .form-group { margin-bottom: 13px; }
  .form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: var(--text); }
  .form-control { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 15px; background: var(--white); transition: border-color .15s; color: var(--text); }
  .form-control:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(26,111,181,0.1); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { display: block; width: 100%; padding: 13px; border-radius: var(--radius); font-size: 15px; font-weight: 700; cursor: pointer; border: none; text-align: center; transition: background .15s; }
  .btn-primary { background: var(--blue); color: white; margin-bottom: 14px; }
  .btn-primary:hover { background: var(--blue-dark); }
  .alert { padding: 12px 14px; border-radius: var(--radius); font-size: 14px; margin-bottom: 16px; background: var(--danger-light); color: var(--danger); }
  .auth-switch { text-align: center; color: var(--text-muted); font-size: 14px; margin-top: 8px; }
  .auth-switch a { color: var(--blue); font-weight: 600; text-decoration: none; }
  .category-note { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
</style>
</head>
<body>
<div class="auth-header">
  <div class="auth-logo">Clini<span>xis</span></div>
  <div class="auth-tagline">Register your business today</div>
</div>
<div class="auth-body">
  <h1 class="auth-title">Create your account</h1>
  <p class="auth-sub">Free to start. Your data stays private.</p>

  {% if error %}<div class="alert">{{ error }}</div>{% endif %}

  <form method="POST">
    <div class="form-group">
      <label class="form-label">Business name</label>
      <input class="form-control" type="text" name="pharmacy_name" placeholder="e.g. Grace Pharmacy, MedEquip Supplies" required>
    </div>
    <div class="form-group">
      <label class="form-label">Business type</label>
      <select class="form-control" name="business_type">
        <option value="pharmacy">Pharmacy</option>
        <option value="equipment">Medical Equipment Supplier</option>
        <option value="health_supply">Health Supply Store</option>
        <option value="clinic">Clinic</option>
        <option value="other">Other Health Business</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Owner name</label>
      <input class="form-control" type="text" name="owner_name" placeholder="e.g. Grace Okoro" required>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-control" type="email" name="email" placeholder="your@email.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Phone</label>
        <input class="form-control" type="tel" name="phone" placeholder="080..." required>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">WhatsApp number (for daily reports)</label>
      <input class="form-control" type="tel" name="whatsapp" placeholder="e.g. 2348012345678">
      <div class="category-note">Include country code. We will send you daily sales summaries.</div>
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input class="form-control" type="password" name="password" placeholder="Choose a strong password" required minlength="6">
    </div>
    <button class="btn btn-primary" type="submit">Create account</button>
  </form>
  <div class="auth-switch">Already have an account? <a href="/login">Sign in here</a></div>
</div>
</body>
</html>
